<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>fun.kuirinlahti.dev</title>
  <meta name="description" content="Pieniä, hölmöjä ja hauskoja nettipelejä.">

  <!-- Linkin esikatselu Discordissa, WhatsAppissa, X:ssä jne. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="fun.kuirinlahti.dev">
  <meta property="og:title" content="fun.kuirinlahti.dev">
  <meta property="og:description" content="Pieniä, hölmöjä ja hauskoja nettipelejä.">
  <meta property="og:url" content="https://fun.kuirinlahti.dev/">
  <meta property="og:image" content="https://fun.kuirinlahti.dev/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#2f80ed">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233d7bff'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle'%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="shared/account.css">
</head>
<body>
  <header>
    <h1>fun.kuirinlahti.dev</h1>
    <p>Pieniä, hölmöjä ja hauskoja nettipelejä.</p>
  </header>

  <!-- Pelikortit tulevat tiedostosta shared/games.js — uusi peli lisätään sinne -->
  <main class="games" id="games">
    <div class="game soon">
      <div class="placeholder">🎲</div>
      <div class="info">
        <h2>Lisää tulossa</h2>
        <p>Seuraava hölmö idea on työn alla.</p>
      </div>
    </div>
  </main>

  <footer>Tekijä: <a href="https://www.kuirinlahti.dev">kuirinlahti.dev</a></footer>

  <script>
    // Ladataan pelilista aina tuoreena (ks. välimuistihuomio hittimeemi/index.html:ssä)
    const list = document.createElement("script");
    list.src = "shared/games.js?v=" + Date.now();
    list.onload = () => {
      const soon = document.querySelector("#games .soon");
      for (const g of window.GAMES || []) {
        const a = document.createElement("a");
        a.className = "game";
        a.href = g.url.replace(/^\//, ""); // suhteellinen, toimii myös paikallisesti
        a.innerHTML = `<img src="${g.image.replace(/^\//, "")}" alt="" loading="lazy">
          <div class="info"><h2>${g.title}</h2><p>${g.tagline}</p></div>`;
        soon.before(a);
      }
    };
    document.body.appendChild(list);

    // Kirjautumisnappi oikeaan yläkulmaan (account.js tarvitsee net.js:n)
    for (const src of ["shared/net.js", "shared/account.js"]) {
      const s = document.createElement("script");
      s.src = src + "?v=" + Date.now();
      s.async = false;
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
