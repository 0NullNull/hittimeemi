<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Lobbytesti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0d17; --surface: #151829; --surface-2: #1c2036; --border: #272c47;
      --text: #f1f3fb; --muted: #8b91ad; --accent: #3d7bff; --accent-2: #6aa8ff;
      --green: #34d399; --red: #f87171; --yellow: #fbbf24;
      --display: "Bricolage Grotesque", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(900px 500px at 50% -180px, rgba(61, 123, 255, 0.28), transparent 70%), var(--bg);
      background-attachment: fixed;
    }
    .home-link { position: absolute; top: 20px; left: 24px; color: var(--muted); text-decoration: none; }
    .home-link:hover { color: var(--text); }
    main { max-width: 980px; margin: 0 auto; padding: 72px 24px 48px; }
    header { text-align: center; margin-bottom: 28px; }
    h1 { margin: 0; font: 800 2.6rem/1.05 var(--display); letter-spacing: -0.03em; }
    header p { margin: 10px 0 16px; color: var(--muted); }
    .status { display: inline-flex; align-items: center; gap: 10px; padding: 6px 14px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface); }
    #dot { width: 10px; height: 10px; border-radius: 50%; background: var(--yellow); }
    #dot.online { background: var(--green); }
    #dot.offline { background: var(--red); }
    #server { display: block; margin-top: 8px; color: var(--muted); font-size: 0.85rem; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
    .lobby { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; max-width: 720px; margin: 0 auto; }
    .lobby h2, .card h2 { margin: 0 0 14px; font: 700 1.25rem var(--display); }
    label { display: block; color: var(--muted); font-size: 0.9rem; margin-bottom: 6px; }
    input[type="text"] {
      width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--surface-2); color: var(--text); font: inherit;
    }
    input[type="text"]:focus { outline: 2px solid var(--accent-2); outline-offset: 1px; }
    #code { text-transform: uppercase; letter-spacing: 0.2em; font-weight: 600; }
    .row { display: flex; gap: 10px; margin-top: 12px; }
    .btn {
      padding: 11px 18px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2);
      color: var(--text); font: 600 0.95rem Inter, sans-serif; cursor: pointer; white-space: nowrap;
    }
    .btn:hover { border-color: var(--accent-2); }
    .btn.primary { background: var(--accent); border-color: var(--accent); }
    .btn.primary:hover { background: #2f6af0; }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .room { display: grid; grid-template-columns: 300px 1fr; gap: 24px; }
    .eyebrow { display: block; color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; }
    #room-code { display: block; font: 800 3rem/1.1 var(--display); letter-spacing: 0.12em; margin: 4px 0 14px; }
    #players { list-style: none; padding: 0; margin: 18px 0; display: grid; gap: 8px; }
    #players li { display: flex; justify-content: space-between; gap: 8px; padding: 9px 12px; border-radius: 10px; background: var(--surface-2); }
    #players li.me { outline: 1px solid var(--accent); }
    #players li.away { color: var(--muted); }
    #players .tag { color: var(--muted); font-size: 0.85rem; }
    .check { display: flex; align-items: center; gap: 8px; color: var(--muted); margin-bottom: 16px; }
    .chat { display: flex; flex-direction: column; min-height: 420px; }
    #log { flex: 1; list-style: none; margin: 0; padding: 0; overflow-y: auto; max-height: 460px; display: grid; align-content: start; gap: 6px; }
    #log li b { color: var(--accent-2); margin-right: 6px; }
    #log li.system { color: var(--muted); font-style: italic; }
    #error { min-height: 1.5em; margin: 18px 0 0; text-align: center; color: var(--red); }
    @media (max-width: 760px) { .lobby, .room { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <a class="home-link" href="/">← Kaikki pelit</a>
  <main>
    <header>
      <h1>Lobbytesti</h1>
      <p>Pelipalvelimen testisivu. Avaa tämä kahteen ikkunaan: luo huone toisessa ja liity toisella.</p>
      <span class="status"><span id="dot"></span><span id="status-text">Yhdistetään palvelimeen…</span></span>
      <code id="server"></code>
    </header>

    <div id="lobby" class="lobby">
      <section class="card">
        <h2>Luo huone</h2>
        <label for="name">Nimesi</label>
        <input id="name" type="text" maxlength="20" autocomplete="off" spellcheck="false">
        <div class="row"><button id="create" class="btn primary">Luo huone</button></div>
      </section>
      <section class="card">
        <h2>Liity huoneeseen</h2>
        <label for="code">Huoneen koodi</label>
        <input id="code" type="text" maxlength="4" placeholder="ABCD" autocomplete="off" spellcheck="false">
        <div class="row"><button id="join" class="btn">Liity</button></div>
      </section>
    </div>

    <div id="room" class="room" hidden>
      <section class="card">
        <span class="eyebrow">Huoneen koodi</span>
        <strong id="room-code"></strong>
        <button id="copy" class="btn">Kopioi kutsulinkki</button>
        <ul id="players"></ul>
        <label class="check"><input type="checkbox" id="lock"> Lukitse huone (vain isäntä)</label>
        <button id="leave" class="btn">Poistu huoneesta</button>
      </section>
      <section class="card chat">
        <h2>Chat</h2>
        <ol id="log"></ol>
        <form id="say" class="row">
          <input id="text" type="text" maxlength="300" placeholder="Kirjoita viesti…" autocomplete="off">
          <button class="btn primary">Lähetä</button>
        </form>
      </section>
    </div>

    <p id="error" role="alert"></p>
  </main>

  <script>
    // Tuorein versio aina (GitHub Pages pitää tiedostoja välimuistissa 10 min)
    const s = document.createElement("script");
    s.src = "/shared/net.js?v=" + Date.now();
    s.onload = start;
    document.body.append(s);

    function start() {
      const $ = (id) => document.getElementById(id);
      const params = new URLSearchParams(location.search);
      const remember = {
        get() { try { return localStorage.getItem("lt-name") || ""; } catch { return ""; } },
        set(v) { try { localStorage.setItem("lt-name", v); } catch {} },
      };
      $("name").value = remember.get();
      if (params.get("room")) $("code").value = params.get("room").toUpperCase();

      const STATUS = {
        connecting: "Yhdistetään palvelimeen…",
        online: "Yhteys toimii",
        offline: "Palvelin ei vastaa, yritetään uudelleen…",
      };

      const net = Net.connect("chat", {
        status(s) {
          $("dot").className = s;
          $("status-text").textContent = STATUS[s];
        },
        latency(ms) {
          if (net.status === "online") $("status-text").textContent = `Yhteys toimii · ${ms} ms`;
        },
        room: render,
        message(m) {
          if (m.type === "history") {
            $("log").replaceChildren();
            m.lines.forEach(addLine);
          }
          if (m.type === "say") addLine(m.line);
        },
        error(e) {
          $("error").textContent = e.message;
        },
      });
      $("server").textContent = net.url;

      let known = new Map(); // id → nimi, liittymis- ja lähtöilmoituksia varten

      function render(r) {
        $("lobby").hidden = !!r;
        $("room").hidden = !r;
        if (!r) {
          known = new Map();
          $("log").replaceChildren();
          document.title = "Lobbytesti";
          return;
        }
        $("error").textContent = "";
        $("room-code").textContent = r.code;
        $("lock").checked = r.locked;
        $("lock").disabled = !net.isHost;
        const list = r.players.map((p) => {
          const li = document.createElement("li");
          li.classList.toggle("me", p.id === r.you);
          li.classList.toggle("away", !p.connected);
          const name = document.createElement("span");
          name.textContent = p.name + (p.id === r.you ? " (sinä)" : "");
          const tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = [p.id === r.host && "isäntä", !p.connected && "yhteys poikki"].filter(Boolean).join(" · ");
          li.append(name, tag);
          return li;
        });
        $("players").replaceChildren(...list);
        document.title = `Lobbytesti · ${r.code} (${r.players.length}/${r.max})`;

        if (known.size) {
          for (const p of r.players) if (!known.has(p.id)) system(`${p.name} liittyi`);
          for (const [id, name] of known) if (!r.players.some((p) => p.id === id)) system(`${name} lähti`);
        }
        known = new Map(r.players.map((p) => [p.id, p.name]));
      }

      function addLine(line) {
        const li = document.createElement("li");
        const who = document.createElement("b");
        who.textContent = line.name;
        li.append(who, line.text);
        $("log").append(li);
        li.scrollIntoView({ block: "nearest" });
      }
      function system(text) {
        const li = document.createElement("li");
        li.className = "system";
        li.textContent = text;
        $("log").append(li);
      }

      function name() {
        const n = $("name").value.trim();
        if (!n) {
          $("error").textContent = "Anna ensin nimi.";
          $("name").focus();
          return null;
        }
        remember.set(n);
        $("error").textContent = "";
        return n;
      }

      $("create").onclick = () => { const n = name(); if (n) net.create(n); };
      $("join").onclick = () => {
        const code = $("code").value.trim();
        if (!code) return ($("error").textContent = "Kirjoita huoneen koodi.");
        const n = name();
        if (n) net.join(code, n);
      };
      $("code").onkeydown = (e) => e.key === "Enter" && $("join").click();
      $("name").onkeydown = (e) => e.key === "Enter" && ($("code").value ? $("join") : $("create")).click();
      $("leave").onclick = () => net.leave();
      $("lock").onchange = () => net.send({ type: "lock", locked: $("lock").checked });
      $("say").onsubmit = (e) => {
        e.preventDefault();
        const text = $("text").value.trim();
        if (text && net.send({ type: "say", text })) $("text").value = "";
      };
      $("copy").onclick = async () => {
        const link = new URL(location.href);
        link.search = "";
        link.searchParams.set("room", net.room.code);
        if (params.get("server")) link.searchParams.set("server", params.get("server"));
        try {
          await navigator.clipboard.writeText(link.href);
          $("copy").textContent = "Kopioitu!";
        } catch {
          prompt("Kutsulinkki:", link.href);
        }
        setTimeout(() => ($("copy").textContent = "Kopioi kutsulinkki"), 1500);
      };
    }
  </script>
</body>
</html>
